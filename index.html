<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>アニメ手帖 — 評価・好み分析・クール別オススメ</title>
<style>
:root{
  --bg:#12131a;--panel:#1b1d27;--panel2:#242736;--line:#2e3144;--text:#ecedf3;--sub:#9da1b5;
  --accent:#ff6b81;--accent2:#5eead4;--warn:#fbbf24;--prime:#38bdf8;--netflix:#f43f5e;
  --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(18,19,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1600px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;letter-spacing:.04em}
.logo b{color:var(--accent)}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 14px;border-radius:999px;color:var(--sub);cursor:pointer;font-weight:600}
nav button.on{background:var(--panel2);color:var(--text)}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--sub);cursor:pointer}
.chip.ok{color:var(--accent2);border-color:#2a5b55}
.chip.bad{color:var(--warn);border-color:#6b5a1c}
main{max-width:1600px;margin:0 auto;padding:18px 16px 80px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar select,.toolbar input[type=text],.field input,.field select,.field textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.toolbar input[type=text]{min-width:200px;flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--sub)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#220;}
.btn.danger{color:#ff9aa8}
label.chk{display:flex;gap:6px;align-items:center;color:var(--sub);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:12px}
@media(max-width:1000px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-3px);border-color:#4a4f6e}
.cover{position:relative;aspect-ratio:2/3;background:var(--panel2) center/cover no-repeat}
.cover .score{position:absolute;top:8px;left:8px;background:var(--accent);color:#220;font-weight:800;border-radius:8px;padding:2px 9px;font-size:15px}
.cover .match{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.72);color:var(--accent2);font-weight:700;border-radius:8px;padding:2px 8px;font-size:12px}
.cover .badges{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;color:#fff}
.badge.prime{background:var(--prime);color:#04202e}
.badge.netflix{background:var(--netflix)}
.badge.hint{background:rgba(0,0,0,.65);border:1px dashed #aaa;color:#ddd}
.cbody{padding:9px 10px 11px;display:flex;flex-direction:column;gap:4px}
.ctitle{font-size:14px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:var(--sub)}
.reason{font-size:11.5px;color:var(--accent2)}
.memo{font-size:12px;color:var(--sub);font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:50px 10px;text-align:center;color:var(--sub)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.panel h2{margin:0 0 10px;font-size:17px}
.panel h3{margin:14px 0 6px;font-size:14px;color:var(--sub)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--sub)}
.field textarea{min-height:120px;resize:vertical}
.hint{font-size:12.5px;color:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bars{display:grid;gap:6px}
.bar-r{display:grid;grid-template-columns:130px 1fr 52px;gap:8px;align-items:center;font-size:13px}
.track{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px}
.fill.pos{background:var(--accent2)}.fill.neg{background:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.two{grid-template-columns:1fr}.bar-r{grid-template-columns:100px 1fr 44px}}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:760px;width:100%;overflow:hidden}
.mhead{display:flex;gap:16px;padding:18px}
.mhead .mc{width:130px;aspect-ratio:2/3;background:var(--panel2) center/cover;border-radius:10px;flex:none}
.mhead h2{margin:0 0 4px;font-size:20px;line-height:1.3}
.mbody{padding:0 18px 18px}
.scores{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:8px 0}
.scores button{padding:10px 0;border-radius:9px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:700}
.scores button.on{background:var(--accent);border-color:var(--accent);color:#220}
.desc{font-size:13px;color:var(--sub);max-height:110px;overflow:auto;white-space:pre-wrap}
.stream-row{display:flex;gap:10px;flex-wrap:wrap}
.stream-row .sbox{flex:1;min-width:200px;background:var(--panel2);border-radius:10px;padding:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--line);padding:10px 18px;border-radius:999px;z-index:99;font-size:14px}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--panel2);color:var(--sub);margin:0 4px 4px 0}
.stick{position:sticky;top:var(--hh,56px);z-index:15;background:var(--bg);padding:12px 0 2px;margin:-12px 0 6px;border-bottom:1px solid var(--line)}
.stick .toolbar{margin-bottom:10px}
.gh{grid-column:1/-1;margin:14px 0 0;padding:6px 2px;font-size:18px;border-bottom:2px solid var(--accent);color:var(--text)}
.gh:first-child{margin-top:0}
.card.item{flex-direction:row;cursor:default}
.card.item:hover{transform:none;border-color:#4a4f6e}
.item .cover{width:92px;flex:none;aspect-ratio:2/3;align-self:flex-start;cursor:pointer}
.item .cbody{flex:1;min-width:0;padding:10px 14px 12px;gap:6px}
.item .ctitle{font-size:15px;cursor:pointer;-webkit-line-clamp:1}
.item .ctitle:hover{color:var(--accent2)}
.item .bd{display:flex;gap:4px;min-height:0}
.qc{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.sbs{display:flex;gap:4px}
.sb{flex:1;min-width:0;padding:9px 0;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:700;font-size:14px;color:var(--sub)}

.qb:hover{border-color:var(--sub)}

<script>
'use strict';
/* =============== utils =============== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowIso=()=>new Date().toISOString();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}

/* =============== state =============== */
const LS_DB='animedb.v1',LS_SET='animedb.settings.v1',LS_CACHE='animedb.seasoncache.v1';
const SEASONS=[['WINTER','冬 (1月〜)'],['SPRING','春 (4月〜)'],['SUMMER','夏 (7月〜)'],['FALL','秋 (10月〜)']];
const SEASON_JA={WINTER:'冬',SPRING:'春',SUMMER:'夏',FALL:'秋'};

function emptyDb(){return{schema_version:1,updated_at:null,ratings:{},streaming_override:{},streaming_cache:{}}}
let db=Object.assign(emptyDb(),lsGet(LS_DB,{}));
let settings=Object.assign({tmdb_key:'',google_client_id:'',drive_linked:false},lsGet(LS_SET,{}));

function curSeason(d=new Date()){const m=d.getMonth()+1;return{year:d.getFullYear(),season:m<=3?'WINTER':m<=6?'SPRING':m<=9?'SUMMER':'FALL'}}

const ui={tab:'season',year:S0.year,season:S0.season,items:[],loading:false,error:'',sort:'auto',onlyUnrated:false,svc:'all',

/* =============== AniList =============== */
const MEDIA_FIELDS=`id title{romaji english native} coverImage{large} genres tags{name rank isMediaSpoiler}
 averageScore popularity description(asHtml:false) episodes season seasonYear siteUrl
 studios(isMain:true){nodes{name}} externalLinks{site type}`;
async function anilist(query,variables){
  const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query,variables})});
  if(r.status===429)throw new Error('AniListのアクセス制限中です。1分ほど待ってからやり直してください。');
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.errors)throw new Error('AniListエラー: '+((j.errors&&j.errors[0]&&j.errors[0].message)||r.status));
  return j.data;
}
function normItem(m){
  const tags=(m.tags||[]).filter(t=>!t.isMediaSpoiler&&t.rank>=50).slice(0,8).map(t=>t.name);
  const links=(m.externalLinks||[]).filter(l=>l.type==='STREAMING').map(l=>l.site||'');
  return{id:m.id,romaji:m.title.romaji||'',english:m.title.english||'',native:m.title.native||'',
    cover:(m.coverImage&&m.coverImage.large)||'',genres:m.genres||[],tags,
    avg:m.averageScore||null,pop:m.popularity||0,desc:(m.description||'').slice(0,320),
    episodes:m.episodes||null,studio:((m.studios&&m.studios.nodes[0])||{}).name||'',url:m.siteUrl||'',
    season:m.season||null,year:m.seasonYear||null,
    links:{prime:links.some(s=>/amazon|prime/i.test(s)),netflix:links.some(s=>/netflix/i.test(s))}};
}
// ジャンル・タグの日本語表示（保存データは英語のまま。ここにない語は英語のまま表示）

'Action':'アクション','Adventure':'冒険','Comedy':'コメディ','Drama':'ドラマ','Ecchi':'お色気','Fantasy':'ファンタジー','Horror':'ホラー','Mahou Shoujo':'魔法少女','Mecha':'ロボット','Music':'音楽','Mystery':'ミステリー','Psychological':'心理','Romance':'恋愛','Sci-Fi':'SF','Slice of Life':'日常','Sports':'スポーツ','Supernatural':'超常現象','Thriller':'サスペンス',
'Shounen':'少年向け','Shoujo':'少女向け','Seinen':'青年向け','Josei':'女性向け','Isekai':'異世界','School':'学園','School Club':'部活','Super Power':'超能力','Magic':'魔法','Military':'軍事','Historical':'歴史','Time Travel':'タイムトラベル','Time Loop':'タイムループ','Reincarnation':'転生','Gore':'流血・グロ','Violence':'暴力','Swordplay':'剣戟','Martial Arts':'武術','Survival':'サバイバル','Post-Apocalyptic':'終末世界','Dystopian':'ディストピア','Space':'宇宙','Cyberpunk':'サイバーパンク','Steampunk':'スチームパンク','Video Games':'ゲーム','Virtual World':'仮想世界','Idol':'アイドル','Idols (Female)':'アイドル(女性)','Idols (Male)':'アイドル(男性)','Band':'バンド','Cute Girls Doing Cute Things':'美少女日常','Iyashikei':'癒やし系','Coming of Age':'成長物語','Workplace':'職場','Food':'食べ物','Cooking':'料理','Detective':'探偵','Crime':'犯罪','Police':'警察','Gangs':'ギャング','Yakuza':'ヤクザ','Anti-Hero':'アンチヒーロー','Male Protagonist':'男性主人公','Female Protagonist':'女性主人公','Ensemble Cast':'群像劇','Primarily Adult Cast':'大人中心','Primarily Teen Cast':'10代中心','Primarily Female Cast':'女性中心','Primarily Male Cast':'男性中心','Primarily Child Cast':'子ども中心','Love Triangle':'三角関係','Harem':'ハーレム','Reverse Harem':'逆ハーレム','Yuri':'百合','Boys\' Love':'BL','Shounen Ai':'BL','Tragedy':'悲劇','Revenge':'復讐','War':'戦争','Politics':'政治','Royalty':'王族','Nobility':'貴族','Vampire':'吸血鬼','Zombie':'ゾンビ','Demons':'悪魔','Gods':'神','Angels':'天使','Ghost':'幽霊','Youkai':'妖怪','Mythology':'神話','Dragons':'ドラゴン','Elf':'エルフ','Witch':'魔女','Ninja':'忍者','Samurai':'侍','Pirates':'海賊','Robots':'ロボット','Aliens':'宇宙人','Artificial Intelligence':'AI','Cyborg':'サイボーグ','Superhero':'ヒーロー','Parody':'パロディ','Satire':'風刺','Black Comedy':'ブラックコメディ','Slapstick':'ドタバタ','Gag Humor':'ギャグ','Rakugo':'落語','Kuudere':'クーデレ','Tsundere':'ツンデレ','Yandere':'ヤンデレ','Maids':'メイド','Basketball':'バスケ','Baseball':'野球','Football':'サッカー','Tennis':'テニス','Volleyball':'バレー','Swimming':'水泳','Boxing':'ボクシング','Racing':'レース','Golf':'ゴルフ','Card Battle':'カードバトル','Board Game':'ボードゲーム','Gambling':'ギャンブル','Chuunibyou':'中二病','Hikikomori':'ひきこもり','Bullying':'いじめ','Medical':'医療','Teacher':'教師','College':'大学','Boarding School':'寄宿学校','Delinquents':'不良','Otaku Culture':'オタク文化','Alternate Universe':'並行世界','Parallel Worlds':'パラレルワールド','Memory Manipulation':'記憶操作','Amnesia':'記憶喪失','Body Swapping':'入れ替わり','Shapeshifting':'変身','Transformation':'変身','Disability':'障害','Death Game':'デスゲーム','Battle Royale':'バトルロイヤル','Tournament':'トーナメント','Kingdom Management':'国家運営','Law and Order':'法と秩序','Espionage':'諜報','Assassins':'暗殺者','Terrorism':'テロ','Age Gap':'年の差','Arranged Marriage':'政略結婚','Marriage':'結婚','Family Life':'家族','Siblings':'兄弟姉妹','Childcare':'育児','Found Family':'擬似家族','Travel':'旅','Camping':'キャンプ','Fishing':'釣り','Mountaineering':'登山','Agriculture':'農業','Calligraphy':'書道','Classic Literature':'古典文学','Photography':'写真','Acting':'演技','Writing':'執筆','Anthology':'オムニバス','Episodic':'一話完結','Lost Civilization':'失われた文明','Cosmic Horror':'コズミックホラー','Urban Fantasy':'現代ファンタジー','Rural':'田舎','Philosophy':'哲学','Religion':'宗教','Fugitive':'逃亡者','Mixed Gender Harem':'男女ハーレム','Female Harem':'女性ハーレム','Male Harem':'男性ハーレム','Henshin':'変身ヒーロー','Kaiju':'怪獣','Dinosaurs':'恐竜','Animals':'動物','Cats':'猫','Dogs':'犬','Cars':'車','Trains':'電車','Aviation':'航空','Wuxia':'武侠','Cultivation':'修仙','Chibi':'ちび','CGI':'CG','Rotoscoping':'ロトスコープ','Heist':'強盗・怪盗','Conspiracy':'陰謀','Betrayal':'裏切り','Torture':'拷問','Cannibalism':'人食い','Drugs':'薬物','Alchemy':'錬金術','Necromancy':'死霊術','Fairy Tale':'おとぎ話','Wilderness':'大自然','Environmental':'環境','Economics':'経済','Software Development':'ソフト開発','Augmented Reality':'拡張現実','Memory':'記憶','Dissociative Identities':'多重人格','Class Struggle':'階級闘争','Afterlife':'あの世','Real Robot':'リアルロボット','Super Robot':'スーパーロボット','Mixed Martial Arts':'総合格闘技','Wrestling':'プロレス','Fencing':'フェンシング','Archery':'弓道','Rugby':'ラグビー','Skiing':'スキー','Cycling':'自転車','Horticulture':'園芸','Desert':'砂漠','Cowboys':'カウボーイ','Foreign':'海外','Western':'西部劇','Dancing':'ダンス','Ice Skating':'アイススケート','Skateboarding':'スケボー','Mafia':'マフィア','Gunslinging':'銃撃戦','Guns':'銃','Prison':'刑務所','Pandemic':'パンデミック','Slavery':'奴隷','Hip-hop Music':'ヒップホップ','Rock Music':'ロック','Jazz Music':'ジャズ','Classical Music':'クラシック','Musical':'ミュージカル','Fashion':'ファッション','Sumo':'相撲','Mahjong':'麻雀','Go':'囲碁','Shogi':'将棋','Natural Disaster':'自然災害','Island':'島','Sailing':'航海','Scuba Diving':'ダイビング','Surfing':'サーフィン','Ski':'スキー','Parkour':'パルクール','Magic Girl':'魔法少女'
};
const ja=s=>JA[s]||s;
function titleOf(it){return it.native||it.romaji||it.english||'(無題)'}
function remember(items){items.forEach(it=>metaCache.set(it.id,it));return items}

async function fetchSeason(year,season,force){
  const key=year+'-'+season+(ui.ona?'-ona':'');
  const cache=lsGet(LS_CACHE,{});
  if(!force&&seasonMem.has(key))return remember(seasonMem.get(key));
  if(!force&&cache[key]&&Date.now()-cache[key].t<12*3600e3)return remember(cache[key].items);
  const q=`query($s:MediaSeason,$y:Int,$p:Int){Page(page:$p,perPage:50){pageInfo{hasNextPage}
    media(season:$s,seasonYear:$y,type:ANIME,format_in:${ui.ona?'[TV,TV_SHORT,ONA]':'[TV,TV_SHORT]'},sort:POPULARITY_DESC,isAdult:false){${MEDIA_FIELDS}}}}`;
  let items=[];
  for(let p=1;p<=4;p++){
    const d=await anilist(q,{s:season,y:year,p});
    items=items.concat(d.Page.media.map(normItem));
    if(!d.Page.pageInfo.hasNextPage)break;
    await sleep(400);
  }
  seasonMem.set(key,items);
  cache[key]={t:Date.now(),items};
  const keys=Object.keys(cache).sort((a,b)=>cache[b].t-cache[a].t).slice(0,12);
  const trimmed={};keys.forEach(k=>trimmed[k]=cache[k]);
  lsSet(LS_CACHE,trimmed);
  return remember(items);
}
async function searchAnime(text){
  const q=`query($q:String){Page(page:1,perPage:30){media(search:$q,type:ANIME,sort:SEARCH_MATCH,isAdult:false){${MEDIA_FIELDS}}}}`;
  const d=await anilist(q,{q:text});
  return remember(d.Page.media.map(normItem));
}

/* =============== TMDB streaming =============== */
const norm=s=>String(s||'').toLowerCase().replace(/[\s　!-\/:-@\[-`{-~・、。「」『』！？～〜ー‐–—：]/g,'');
async function tmdb(path,params={}){
  const k=(settings.tmdb_key||'').trim();
  const u=new URL('https://api.themoviedb.org/3'+path);
  Object.entries(params).forEach(([a,b])=>u.searchParams.set(a,b));
  const opt={headers:{accept:'application/json'}};
  if(k.length>40)opt.headers.Authorization='Bearer '+k;else u.searchParams.set('api_key',k);
  const r=await fetch(u,opt);
  if(r.status===401)throw new Error('TMDBのキーが無効です（設定を確認）');
  if(!r.ok)throw new Error('TMDB '+r.status);
  return r.json();
}
async function resolveStreaming(it){
  const names=[it.native,it.romaji,it.english].filter(Boolean);
  const nn=names.map(norm).filter(n=>n.length>=2);
  let hit=null;
  for(const q of names){
    const d=await tmdb('/search/tv',{query:q,language:'ja-JP'});
    hit=(d.results||[]).find(r=>(r.genre_ids||[]).includes(16)&&[r.name,r.original_name].map(norm).some(n=>n.length>=2&&nn.some(c=>n.includes(c)||c.includes(n))));
    if(hit)break;
  }
  let rec;
  if(hit){
    const p=await tmdb(`/tv/${hit.id}/watch/providers`);
    const flat=((p.results||{}).JP||{}).flatrate||[];
    const has=re=>flat.some(f=>re.test(f.provider_name||''));
    rec={prime:has(/prime video|amazon/i),netflix:has(/netflix/i),source:'tmdb',tmdb_id:hit.id,overview_ja:(hit.overview||'').trim(),checked_at:nowIso()};
  }else{
    rec={prime:it.links.prime,netflix:it.links.netflix,source:(it.links.prime||it.links.netflix)?'anilist':'none',checked_at:nowIso()};
  }
  db.streaming_cache[it.id]=rec;
  return rec;
}
function streamOf(id){
  const ov=db.streaming_override[id]||{},c=db.streaming_cache[id];
  const f=svc=>{
    if(ov[svc]===true||ov[svc]===false)return{v:ov[svc],src:'manual'};
    if(c)return{v:!!c[svc],src:c.source};
    return{v:null,src:'none'};
  };
  return{prime:f('prime'),netflix:f('netflix')};
}
let streamQueue=[],streamRunning=0,renderTimer=null;
function queueStreaming(items){
  if(!(settings.tmdb_key||'').trim())return;
  items.forEach(it=>{if(!db.streaming_cache[it.id]&&!streamQueue.includes(it))streamQueue.push(it)});
  pumpStream();
}
async function pumpStream(){
  while(streamRunning<3&&streamQueue.length){
    const it=streamQueue.shift();streamRunning++;ui.streamBusy=streamRunning+streamQueue.length;
    (async()=>{
      try{await resolveStreaming(it)}
      catch(e){if(/キーが無効/.test(e.message)){streamQueue=[];toast(e.message,4000)}}
      finally{
        streamRunning--;ui.streamBusy=streamRunning+streamQueue.length;
        if(!streamRunning&&!streamQueue.length)save();
        clearTimeout(renderTimer);renderTimer=setTimeout(()=>{if(ui.tab==='season')renderSeasonGrid();updateStreamNote()},350);
        pumpStream();
      }
    })();
    await sleep(120);
  }
}

/* =============== taste / recommend =============== */
function entries(){return Object.entries(db.ratings).filter(([,r])=>!r.deleted).map(([id,r])=>({id,...r}))}
function activeRatings(){return entries().filter(r=>r.score>0)}
function isRated(id){const r=db.ratings[id];return !!(r&&!r.deleted&&r.score>0)}
function isWatched(id){const r=db.ratings[id];return !!(r&&!r.deleted&&(r.watched||r.score>0))}
function isFav(id){const r=db.ratings[id];return !!(r&&!r.deleted&&r.fav)}
function isWant(id){const r=db.ratings[id];return !!(r&&!r.deleted&&r.want)}
function feats(o){const f=[];(o.genres||[]).forEach(g=>f.push(['g:'+g,1]));(o.tags||[]).forEach(t=>f.push(['t:'+t,.6]));return f}
function buildProfile(){
  const rs=activeRatings();
  if(!rs.length)return{n:0,mean:0,w:{}};
  const mean=rs.reduce((a,r)=>a+r.score,0)/rs.length;
  const num={},den={};
  // 評価済み: 平均との差（お気に入りは+1.5上乗せ）。評価なしのお気に入りは強め(+2)、気になるは弱め(+1)の好みシグナルとして加味
  const samples=[];
  entries().forEach(r=>{
    if(r.score>0)samples.push([r,r.score-mean+(r.fav?1.5:0),1]);
    else if(r.fav)samples.push([r,2,.8]);
    else if(r.want)samples.push([r,1,.5]);
  });
  samples.forEach(([r,dev,sw])=>{feats(r).forEach(([k,w])=>{num[k]=(num[k]||0)+w*sw*dev;den[k]=(den[k]||0)+w*sw})});
  const w={};Object.keys(num).forEach(k=>{w[k]={weight:num[k]/(den[k]+1.5),count:den[k]}});
  return{n:rs.length,mean,w};
}
function recommend(it,prof){
  const f=feats(it);if(!f.length)return{match:null,reasons:[],cons:[]};
  let sum=0,wsum=0;const contrib=[];
  f.forEach(([k,w])=>{const e=prof.w[k];const val=e?e.weight:0;sum+=val*w;wsum+=w;if(e)contrib.push([k,val*w])});
  let raw=wsum?sum/wsum*2:0;
  if(it.avg)raw+=(it.avg-70)/20*.4;
  const match=Math.round(100/(1+Math.exp(-raw*.9)));
  const label=k=>k.slice(2);
  const reasons=contrib.filter(c=>c[1]>0.15).sort((a,b)=>b[1]-a[1]).slice(0,3).map(c=>label(c[0]));
  const cons=contrib.filter(c=>c[1]<-0.15).sort((a,b)=>a[1]-b[1]).slice(0,2).map(c=>label(c[0]));
  return{match,reasons,cons};
}

/* =============== data ops =============== */
function snapshot(it){return{title:titleOf(it),title_native:it.native,cover:it.cover,
  season:(it.year&&it.season)?it.year+'-'+it.season:'',genres:it.genres,tags:it.tags}}
function upsert(it,patch){
  const old=db.ratings[it.id];
  const live=(old&&!old.deleted)?old:null;
  const wasWatched=!!(live&&(live.watched||live.score>0));
  const cur=Object.assign({score:0,memo:'',watched:false,fav:false,want:false},snapshot(it),live||{},patch);
  if(cur.score>0)cur.watched=true;
  if(cur.watched&&!wasWatched&&patch.want===undefined)cur.want=false; // 見たら「気になる」は自動で外す
  cur.rated_at=cur.rated_at||nowIso();cur.updated_at=nowIso();
  if(!(cur.score>0)&&!cur.watched&&!cur.fav&&!cur.want&&!cur.memo){
    if(old)db.ratings[it.id]={...old,deleted:true,updated_at:nowIso()};
  }else db.ratings[it.id]=cur;
  save();
}
function ctrlHtml(id){
  const r=db.ratings[id],ok=r&&!r.deleted,sc=ok?(r.score||0):0;
  return`<div class="qc" data-id="${id}"><div class="sbs">${Array.from({length:10},(_,i)=>`<button class="sb ${sc===i+1?'on':''}" data-s="${i+1}" title="${i+1}点（もう一度押すと解除）">${i+1}</button>`).join('')}</div><div class="r2"><input class="qm" maxlength="140" placeholder="一言メモ（Enterで保存）" value="${esc(ok?r.memo:'')}"><button class="qb q ${isWant(id)?'on':''}" data-a="q" title="今後みたい（気になる）">☆ 気になる</button><button class="qb w ${isWatched(id)?'on':''}" data-a="w" title="視聴済み">✓ 視聴済み</button><button class="qb f ${isFav(id)?'on':''}" data-a="f" title="お気に入り">♥ お気に入り</button></div></div>`;
}
function refreshCard(card,id){
  if(!card)return;
  const r=db.ratings[id],ok=r&&!r.deleted,sc=ok?(r.score||0):0;
  const cov=card.querySelector('.cover');let s=cov.querySelector('.score');
  if(sc>0){if(!s){s=document.createElement('span');s.className='score';cov.prepend(s)}s.textContent=sc;const m=cov.querySelector('.match');if(m)m.remove()}
  else if(s)s.remove();
  const q=card.querySelector('.qc');
  q.querySelectorAll('.sb').forEach(x=>x.classList.toggle('on',+x.dataset.s===sc));
  q.querySelector('.qb.w').classList.toggle('on',isWatched(id));
  q.querySelector('.qb.q').classList.toggle('on',isWant(id));
  q.querySelector('.qb.f').classList.toggle('on',isFav(id));
}
// 一覧上のクイック操作。処理したらtrueを返す
function gridClick(e){
  const q=e.target.closest('.qc');if(!q)return false;
  const b=e.target.closest('.qb,.sb');if(!b)return true;
  const id=+q.dataset.id,it=itemById(id);if(!it)return true;
  if(b.classList.contains('sb')){
    const s=+b.dataset.s;upsert(it,{score:(isRated(id)&&db.ratings[id].score===s)?0:s});
  }else if(b.dataset.a==='q'){
    if(isWatched(id)){toast('視聴済みの作品です（「気になる」は未視聴の作品用）');return true}

    if(isRated(id)){toast('評価済みの作品は視聴済みです');return true}
    upsert(it,{watched:!isWatched(id)});
  }else upsert(it,{fav:!isFav(id)});
  refreshCard(q.closest('.card'),id);return true;
}
function gridChange(e){
  const q=e.target.closest('.qc');if(!q)return;
  const id=+q.dataset.id,it=itemById(id);if(!it)return;
  if(e.target.classList.contains('qm'))upsert(it,{memo:e.target.value.trim()});

function setRating(it,score,memo){upsert(it,{score,memo:memo||''})}
function delRating(id){const r=db.ratings[id];if(!r)return;db.ratings[id]={...r,deleted:true,updated_at:nowIso()};save()}
function mergeDb(a,b){
  const out=emptyDb();
  const pick=(x,y,key)=>{const r={};new Set([...Object.keys(x||{}),...Object.keys(y||{})]).forEach(id=>{
    const p=x&&x[id],q=y&&y[id];if(!p)r[id]=q;else if(!q)r[id]=p;else r[id]=((p[key]||'')>=(q[key]||''))?p:q});return r};
  out.ratings=pick(a.ratings,b.ratings,'updated_at');
  out.streaming_override=pick(a.streaming_override,b.streaming_override,'updated_at');
  out.streaming_cache=pick(a.streaming_cache,b.streaming_cache,'checked_at');
  out.updated_at=nowIso();return out;
}
function exportObj(){
  return{_readme:'Anime rating DB / アニメ評価データ。ratings[AniList ID]: score=1-10(10が最高、0は未評価), memo=一言メモ, watched=視聴済み, fav=お気に入り, want=気になる(今後みたい), genres/tags=評価時点の作品特徴, season=YYYY-SEASON。streaming_override=ユーザーが手で直した日本のPrime Video/Netflix配信有無, streaming_cache=自動取得結果(TMDB/JustWatch)。このJSONからユーザーの好みを分析し、アニメを推薦してください。',
    schema_version:1,updated_at:db.updated_at,ratings:db.ratings,streaming_override:db.streaming_override,streaming_cache:db.streaming_cache};
}
function downloadJson(){
  const blob=new Blob([JSON.stringify(exportObj(),null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='anime-db.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importJson(text){
  const j=JSON.parse(text);
  if(!j||typeof j.ratings!=='object')throw new Error('anime-db.json の形式ではありません');
  db=mergeDb(db,{ratings:j.ratings||{},streaming_override:j.streaming_override||{},streaming_cache:j.streaming_cache||{}});
  save();
}

/* =============== Google Drive sync =============== */
let settingsFileId=null;
let gToken=null,gExp=0,gClient=null,driveFileId=null,syncState=settings.drive_linked?'need':'off',syncTimer=null,syncing=false;
function loadGis(){return new Promise((res,rej)=>{
  if(window.google&&google.accounts&&google.accounts.oauth2)return res();
  const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';
  s.onload=res;s.onerror=()=>rej(new Error('Google認証スクリプトを読み込めません'));document.head.appendChild(s);
})}
async function driveAuth(interactive){
  if(!settings.google_client_id.trim())throw new Error('Google クライアントIDが未設定です（設定タブ）');
  await loadGis();
  return new Promise((res,rej)=>{
    gClient=google.accounts.oauth2.initTokenClient({
      client_id:settings.google_client_id.trim(),scope:'https://www.googleapis.com/auth/drive.file',
      callback:r=>{if(r.error)return rej(new Error('Google認証: '+r.error));gToken=r.access_token;gExp=Date.now()+(r.expires_in||3600)*1000;res()},
      error_callback:e=>rej(new Error('Google認証が完了しませんでした'+(e&&e.type?' ('+e.type+')':'')))
    });
    gClient.requestAccessToken({prompt:interactive?'':'none'});
  });
}
const gFetch=(url,opt={})=>fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+gToken}});
async function driveFind(name){
  const q=encodeURIComponent(`name='${name}' and trashed=false`);
  const r=await gFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&orderBy=${encodeURIComponent('modifiedTime desc')}&pageSize=1`);
  if(!r.ok)throw new Error('Drive検索に失敗 ('+r.status+')');
  const j=await r.json();return(j.files&&j.files[0]&&j.files[0].id)||null;
}
async function driveWriteJson(name,id,obj){
  const body=JSON.stringify(obj,null,1);
  if(id){
    const r=await gFetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});
    if(!r.ok)throw new Error('Drive保存に失敗 ('+r.status+')');
    return id;
  }
  const b='animedb'+Date.now();
  const meta=JSON.stringify({name,mimeType:'application/json'});
  const mp=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${body}\r\n--${b}--`;
  const r=await gFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:mp});
  if(!r.ok)throw new Error('Drive作成に失敗 ('+r.status+')');
  return (await r.json()).id;
}
// TMDBキーは評価データとは別ファイル（anime-techo-settings.json）でDriveに保存して端末間で共有する
async function syncSettingsFile(){
  const name='anime-techo-settings.json';
  if(!settingsFileId)settingsFileId=await driveFind(name);
  let remote=null;
  if(settingsFileId){
    const r=await gFetch(`https://www.googleapis.com/drive/v3/files/${settingsFileId}?alt=media`);
    if(r.ok)remote=await r.json().catch(()=>null);
  }
  const local=(settings.tmdb_key||'').trim();
  const rk=((remote&&remote.tmdb_key)||'').trim();
  if(rk&&(!local||(rk!==local&&(settings.tmdb_key_at||'')<=(remote.updated_at||'')))){
    settings.tmdb_key=rk;settings.tmdb_key_at=remote.updated_at||nowIso();saveSettings();
    toast('TMDBキーをDriveから読み込みました');
    if(ui.items.length)queueStreaming(ui.items);
  }else if(local&&rk!==local){
    const at=settings.tmdb_key_at||nowIso();settings.tmdb_key_at=at;saveSettings();
    settingsFileId=await driveWriteJson(name,settingsFileId,{_readme:'アニメ手帖の設定（Drive同期用）。TMDB APIキーが入っています。他人やAIに渡さないでください。',tmdb_key:local,updated_at:at});
  }
}
async function driveSync(interactive){
  if(syncing)return;syncing=true;setSync('busy');
  try{
    if(!gToken||Date.now()>gExp-60000)await driveAuth(interactive);
    let id=driveFileId;
    if(!id){
      const q=encodeURIComponent("name='anime-db.json' and trashed=false");
      const r=await gFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&orderBy=${encodeURIComponent('modifiedTime desc')}&pageSize=1`);
      if(!r.ok)throw new Error('Drive検索に失敗 ('+r.status+')。Drive APIが有効か確認してください');
      const j=await r.json();id=j.files&&j.files[0]&&j.files[0].id;
    }
    if(id){
      const r=await gFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
      if(r.ok){const remote=await r.json();db=mergeDb(db,{ratings:remote.ratings||{},streaming_override:remote.streaming_override||{},streaming_cache:remote.streaming_cache||{}});saveLocal()}
    }
    const body=JSON.stringify(exportObj(),null,1);
    if(id){
      const r=await gFetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});
      if(!r.ok)throw new Error('Drive保存に失敗 ('+r.status+')');
    }else{
      const b='animedb'+Date.now();
      const meta=JSON.stringify({name:'anime-db.json',mimeType:'application/json'});
      const mp=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${body}\r\n--${b}--`;
      const r=await gFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:mp});
      if(!r.ok)throw new Error('Drive作成に失敗 ('+r.status+')');
      id=(await r.json()).id;
    }
    try{await syncSettingsFile()}catch(e){console.warn('settings sync',e)}
    driveFileId=id;settings.drive_linked=true;saveSettings();setSync('ok');
    if(ui.tab!=='settings')render();
    return true;
  }catch(e){setSync(interactive?'bad':'need');if(interactive)toast(e.message,5000);console.warn(e);return false}
  finally{syncing=false}
}
function scheduleSync(){
  if(!settings.drive_linked)return;
  setSync('dirty');clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{
    if(gToken&&Date.now()<gExp-60000)driveSync(false);else setSync('need');
  },2500);
}

function updateStreamNote(){
  const n=$('#streamNote');if(!n)return;
  if(!(settings.tmdb_key||'').trim())n.textContent='※配信バッジはTMDBキーを設定すると自動表示されます';

const isMulti=()=>ui.year==='ALL'||ui.season==='ALL';
function courList(){
  // 新しい順。現在のクールの次まで（放送前のものも見られる）
  const maxV=S0.year*4+SORD[S0.season];
  const out=[];
  for(let y=S0.year+1;y>=2005;y--){
    if(ui.year!=='ALL'&&y!==ui.year)continue;
    ['FALL','SUMMER','SPRING','WINTER'].forEach(s=>{
      if(ui.season!=='ALL'&&s!==ui.season)return;
      if(y*4+SORD[s]-1>maxV)return;
      out.push({year:y,season:s});
    });
  }
  return out;
}
async function loadSeason(force){
  ui.loadTok++;ui.busyMore=false;
  ui.loading=true;ui.error='';ui.searchResults=null;ui.query='';ui.items=[];ui.cours=[];ui.loaded=0;renderSeasonGrid();
  if(isMulti()){ui.cours=courList();updateMore();await loadMoreCours(force);return}
  try{ui.items=await fetchSeason(ui.year,ui.season,force);queueStreaming(ui.items)}
  catch(e){ui.error=e.message;ui.items=[]}
  ui.loading=false;if(ui.tab==='season')renderSeason($('#main'));
}
async function loadMoreCours(force){
  if(ui.busyMore)return;
  ui.busyMore=true;const tok=ui.loadTok;
  const chunk=ui.year==='ALL'?4:ui.cours.length;
  const target=Math.min(ui.cours.length,ui.loaded+chunk);
  try{
    while(ui.loaded<target){
      const c=ui.cours[ui.loaded];
      const items=await fetchSeason(c.year,c.season,force);
      if(tok!==ui.loadTok)return;
      const have=new Set(ui.items.map(x=>x.id));
      const fresh=items.filter(x=>!have.has(x.id));
      ui.items=ui.items.concat(fresh);queueStreaming(fresh);ui.loaded++;ui.loading=false;
      if(ui.tab==='season'){renderSeasonGrid();updateMore()}
      if(ui.loaded<target)await sleep(300);
    }
  }catch(e){
    if(tok!==ui.loadTok)return;
    if(ui.items.length)toast(e.message,5000);else ui.error=e.message;
  }
  if(tok!==ui.loadTok)return;
  ui.busyMore=false;ui.loading=false;
  if(ui.tab==='season'){renderSeasonGrid();updateMore()}
}
function updateMore(){
  const el=$('#more');if(!el)return;
  if(ui.searchResults||!isMulti()){el.innerHTML='';return}
  const rest=ui.cours.length-ui.loaded;
  if(ui.busyMore)el.innerHTML=`<span class="hint"><span class="spin"></span>読み込み中…（${ui.loaded}/${ui.cours.length}クール）</span>`;
  else if(rest>0){
    el.innerHTML=`<button class="btn pri" id="moreBtn">さらに${Math.min(4,rest)}クール読み込む（残り${rest}クール）</button>`;
    $('#moreBtn').onclick=()=>loadMoreCours(false);
  }else el.innerHTML=`<span class="hint">全${ui.cours.length}クールを表示中</span>`;
}
const courOrd=it=>(it.year&&it.season)?it.year*4+SORD[it.season]:0;
function visibleItems(){
  let items=(ui.searchResults||ui.items).slice();
  const prof=buildProfile();
  const rec=new Map(items.map(it=>[it.id,recommend(it,prof)]));
  if(ui.onlyUnrated)items=items.filter(it=>!isRated(it.id));
  if(ui.state==='unwatched')items=items.filter(it=>!isWatched(it.id));
  else if(ui.state==='watched')items=items.filter(it=>isWatched(it.id));
  else if(ui.state==='want')items=items.filter(it=>isWant(it.id));
  else if(ui.state==='fav')items=items.filter(it=>isFav(it.id));
  if(ui.svc!=='all')items=items.filter(it=>{const s=streamOf(it.id);
    return ui.svc==='prime'?s.prime.v===true:ui.svc==='netflix'?s.netflix.v===true:(s.prime.v===true||s.netflix.v===true)});
  let cmp=null;
  if(!ui.searchResults){
    if(ui.sort==='auto'&&prof.n>=3)cmp=(a,b)=>rec.get(b.id).match-rec.get(a.id).match;
    else if(ui.sort==='avg')cmp=(a,b)=>(b.avg||0)-(a.avg||0);
    else cmp=(a,b)=>b.pop-a.pop;
  }
  const multi=!ui.searchResults&&isMulti();
  if(multi)items.sort((a,b)=>(courOrd(b)-courOrd(a))||(cmp?cmp(a,b):0));
  else if(cmp)items.sort(cmp);
  return{items,rec,prof,multi};
}
function badgesHtml(id){
  const s=streamOf(id);let h='';
  const one=(k,label,cls)=>{const x=s[k];if(x.v===true)h+=`<span class="badge ${x.src==='anilist'?'hint':cls}">${label}</span>`};
  one('prime','Prime','prime');one('netflix','Netflix','netflix');return h;
}
function cardHtml(it,rec,prof){
  const r=db.ratings[it.id],rated=isRated(it.id);
  const rc=rec.get(it.id);
  const showMatch=prof.n>=3&&!rated&&rc&&rc.match!=null;
  return`<div class="card item" data-id="${it.id}">
    <div class="cover" style="background-image:url('${esc(it.cover)}')">${rated?`<span class="score">${r.score}</span>`:''}</div>
    <div class="cbody">
      <div class="ctitle">${esc(titleOf(it))}</div>
      <div class="meta">${esc(it.genres.slice(0,3).map(ja).join(' / '))}${it.avg?` ・ ★${it.avg}`:''}${it.episodes?` ・ ${it.episodes}話`:''}</div>
      <div class="bd">${badgesHtml(it.id)}</div>
      ${showMatch?`<div class="reason">相性 ${rc.match}%${rc.reasons.length?'　◎ '+esc(rc.reasons.map(ja).join('・')):''}</div>`:''}
      ${ctrlHtml(it.id)}
    </div></div>`;
}
function renderSeasonGrid(){
  const g=$('#grid'),note=$('#note');if(!g)return;
  if(ui.loading){note.innerHTML='<div class="empty"><span class="spin"></span>読み込み中…</div>';g.innerHTML='';return}
  if(ui.error){note.innerHTML=`<div class="panel" style="border-color:#6b2a35">${esc(ui.error)}</div>`;g.innerHTML='';return}
  const{items,rec,prof,multi}=visibleItems();
  let msg='';
  if(ui.searchResults)msg=`<p class="hint">「${esc(ui.query)}」の検索結果 ${ui.searchResults.length}件</p>`;
  else if(prof.n<3)msg='<p class="hint">💡 3作品以上に評価をつけると、相性%とおすすめ順が使えるようになります。</p>';
  note.innerHTML=msg;
  if(multi&&items.length){
    let html='',cur=null;
    items.forEach(it=>{
      const k=courOrd(it);
      if(k!==cur){cur=k;html+=`<h3 class="gh">${k?`${it.year}年 ${SEASON_JA[it.season]}アニメ`:'時期不明'}</h3>`}
      html+=cardHtml(it,rec,prof);
    });
    g.innerHTML=html;return;
  }
  g.innerHTML=items.length?items.map(it=>cardHtml(it,rec,prof)).join(''):'<div class="empty" style="grid-column:1/-1">表示できる作品がありません</div>';
}

  </div>
  <div class="two"><div class="panel"><h2>好きな傾向 👍</h2>${bars(pos,'pos')}</div><div class="panel"><h2>苦手な傾向 👎</h2>${bars(neg,'neg')}</div></div>
  <div class="panel"><h2>他のAIに分析してもらう</h2>
    <p class="hint">下のプロンプトをコピーして、ChatGPT・Gemini・Claudeなど好きなAIに貼り付けてください。評価データ込みなので、どのAIでも同じ分析ができます。</p>
    <div class="row" style="margin-bottom:8px">

      <select id="pSeason">${SEASONS.map(([k,l])=>`<option value="${k}" ${k===(ui.promptSeason||S0).season?'selected':''}>${l}</option>`).join('')}</select>

function buildPrompt(items,y,s,pos,neg){
  const rs=activeRatings().map(r=>({title:r.title,score:r.score,memo:r.memo,favorite:!!r.fav,genres:r.genres,tags:r.tags}));
  const svcTxt=id=>{const x=streamOf(id);const a=[];if(x.prime.v)a.push('Prime Video');if(x.netflix.v)a.push('Netflix');return a.join('+')||'配信不明/対象外'};
  const unrated=items.filter(it=>!isWatched(it.id));
  return`あなたはアニメ推薦のアシスタントです。以下の「私の評価データ」から好みを分析し、「候補リスト」から私に合う作品を選んでください。

# 評価データの読み方
- score は1〜10（10が最高）、memoは私の一言メモ。genres/tags は作品の特徴。
- 平均評価: ${buildProfile().mean.toFixed(2)}（これより高い作品が「好き」、低い作品が「合わなかった」）

# 集計済みの傾向（参考）
- 好き: ${pos.map(e=>e.label).join('、')||'なし'}
- 苦手: ${neg.map(e=>e.label).join('、')||'なし'}

# 私の評価データ（JSON）
${JSON.stringify(rs)}

# 候補リスト（${y}年${SEASON_JA[s]}アニメ・未視聴のみ）
${unrated.map(it=>`- ${titleOf(it)} | ${it.genres.join('/')} | ${it.tags.join('/')} | AniList平均:${it.avg||'-'} | 配信:${svcTxt(it.id)}${isWant(it.id)?' | ★気になる(優先して検討)':''}`).join('\n')}

# お願い
1. 私の好みの特徴を3行で要約してください。
2. 候補から、合いそうな順に5作品を選び、理由を各1〜2文で書いてください。
3. 苦手傾向に当たりそうで注意が必要な人気作があれば1〜2本挙げてください。
4. 配信情報（Prime Video / Netflix）も添えてください（不明は不明と書く）。`;
}

    const src=s.src==='manual'?'（手動）':s.src==='tmdb'?'（TMDB/JustWatch）':s.src==='anilist'?'（AniListリンク・地域未確認）':'';
    const cur=ov[k]===true?'yes':ov[k]===false?'no':'auto';
    return`<div class="sbox"><b>${label}</b>：${status}<span class="hint">${src}</span>
      <div class="field" style="margin:6px 0 0"><label>手動で上書き</label><select data-ov="${k}"><option value="auto" ${cur==='auto'?'selected':''}>自動</option><option value="yes" ${cur==='yes'?'selected':''}>見放題あり</option><option value="no" ${cur==='no'?'selected':''}>なし</option></select></div></div>`;
  };
  root.innerHTML=`<div class="ov" id="ov"><div class="modal">
    <div class="mhead"><div class="mc" style="background-image:url('${esc(it.cover)}')"></div>
      <div style="min-width:0"><h2>${esc(titleOf(it))}</h2>
        <div class="meta">${esc([it.romaji!==titleOf(it)?it.romaji:'',it.studio,it.episodes?it.episodes+'話':'',it.avg?'★'+it.avg:''].filter(Boolean).join(' ・ '))}</div>
        <div style="margin:8px 0">${it.genres.map(g=>`<span class="pill">${esc(ja(g))}</span>`).join('')}${it.tags.map(t=>`<span class="pill">#${esc(ja(t))}</span>`).join('')}</div>
        ${prof.n>=3&&rc.match!=null?`<div class="reason">相性 ${rc.match}%${rc.reasons.length?'　◎ '+esc(rc.reasons.map(ja).join('・')):''}${rc.cons.length?'　△ '+esc(rc.cons.map(ja).join('・')):''}</div>`:''}
        <p><a href="${esc(it.url)}" target="_blank" rel="noopener" style="color:var(--accent2)">AniListで開く ↗</a></p>
      </div></div>
    <div class="mbody">
      <div class="desc" id="descBox"${(jpDesc||it.desc)?'':' hidden'}>${jpDesc?esc(jpDesc):esc(it.desc)+(it.desc.length>=320?'…':'')}</div>
      <h3>あなたの評価（10段階）</h3>
      <div class="scores" id="scores">${Array.from({length:10},(_,i)=>`<button data-s="${i+1}" class="${score===i+1?'on':''}">${i+1}</button>`).join('')}</div>
      <div class="field"><label>一言メモ</label><input id="memo" maxlength="140" placeholder="感想を一言" value="${esc(rated?r.memo:'')}"></div>
      <div class="row" style="margin-bottom:10px"><label class="chk"><input type="checkbox" id="mQ" ${isWant(id)?'checked':''}> ☆ 気になる</label><label class="chk"><input type="checkbox" id="mW" ${isWatched(id)?'checked':''}> 視聴済み</label><label class="chk"><input type="checkbox" id="mF" ${isFav(id)?'checked':''}> ♥ お気に入り</label></div>
      <div class="row"><button class="btn pri" id="mSave">保存</button>${rated?'<button class="btn danger" id="mDel">記録を削除</button>':''}<button class="btn" id="mClose">閉じる</button></div>
      <h3>配信状況（日本）</h3>
      <div class="stream-row">${svcBox('prime','Prime Video')}${svcBox('netflix','Netflix')}</div>
      <p class="hint">${(settings.tmdb_key||'').trim()?'':'TMDBキー未設定のため自動取得できません。手動で設定できます。'}</p>
    </div></div></div>`;
  const close=()=>{root.innerHTML='';document.removeEventListener('keydown',onKey)};
  const onKey=e=>{if(e.key==='Escape')close()};
  document.addEventListener('keydown',onKey);
  $('#ov').onclick=e=>{if(e.target.id==='ov')close()};
  $('#mClose').onclick=close;
  $('#scores').onclick=e=>{const b=e.target.closest('button');if(!b)return;score=+b.dataset.s;[...$('#scores').children].forEach(x=>x.classList.toggle('on',+x.dataset.s===score))};
  root.querySelectorAll('select[data-ov]').forEach(sel=>sel.onchange=()=>{
    const ov=Object.assign({},db.streaming_override[id]||{});
    ov[sel.dataset.ov]=sel.value==='auto'?null:sel.value==='yes';
    ov.updated_at=nowIso();db.streaming_override[id]=ov;save();
    toast('配信設定を保存しました');
  });
  $('#mSave').onclick=()=>{
    upsert(it,{score,memo:$('#memo').value.trim(),watched:$('#mW').checked||score>0,fav:$('#mF').checked,want:$('#mQ').checked&&!($('#mW').checked||score>0)});
    toast('保存しました');close();render();
  };
  const del=$('#mDel');if(del)del.onclick=()=>{if(confirm('この作品の記録（評価・メモ・視聴済み・お気に入り）を削除しますか？')){delRating(id);close();render()}};
  if((settings.tmdb_key||'').trim()&&!db.streaming_cache[id]&&metaCache.has(id))queueStreaming([it]);
  // 日本語のあらすじ: TMDB一致済みで未取得なら、開いたときに1回だけ取得して保存
  const sc=db.streaming_cache[id];
  if((settings.tmdb_key||'').trim()&&sc&&sc.tmdb_id&&!sc.overview_ja&&!sc.ov_checked){
    tmdb('/tv/'+sc.tmdb_id,{language:'ja-JP'}).then(d=>{
      const ov=(d.overview||'').trim();sc.ov_checked=true;if(ov)sc.overview_ja=ov;save();
      const box=$('#descBox');if(box&&ov&&$('#ov')){box.hidden=false;box.textContent=ov}
    }).catch(()=>{});
  }
}

/* =============== boot =============== */
function setHH(){document.documentElement.style.setProperty('--hh',$('header').offsetHeight+'px')}
window.addEventListener('resize',setHH);
render();setHH();
if(settings.drive_linked&&settings.google_client_id){
  // 静かに再接続を試みる（失敗しても「要再接続」表示のまま）
  driveSync(false);
}
window.addEventListener('beforeunload',()=>{});
</script>
</body>
</html>
